services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/airbnb.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - airbnb-data:/data
    expose:
      - "8000"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8000
    environment:
      API_ORIGIN: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  airbnb-data:
